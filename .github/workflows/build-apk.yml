name: Build CellCerto APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restaurar assinatura de teste
        uses: actions/cache@v4
        with:
          path: /home/runner/.android/debug.keystore
          key: cellcerto-android-debug-keystore-v2

      - name: Criar assinatura de teste se necessário
        run: |
          mkdir -p /home/runner/.android
          if [ ! -f /home/runner/.android/debug.keystore ]; then
            keytool -genkeypair -v               -keystore /home/runner/.android/debug.keystore               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=CellCerto Debug, O=CellCerto Box 221, C=BR"
          fi
          keytool -list -keystore /home/runner/.android/debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Exportar chave temporariamente
        uses: actions/upload-artifact@v4
        with:
          name: CellCerto-Signing-Key-Temporary
          path: /home/runner/.android/debug.keystore
          retention-days: 1

      - name: Instalar Android 34
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Exportar apksigner temporariamente
        uses: actions/upload-artifact@v4
        with:
          name: CellCerto-ApkSigner-Temporary
          path: |
            /usr/local/lib/android/sdk/build-tools/34.0.0/apksigner
            /usr/local/lib/android/sdk/build-tools/34.0.0/lib/apksigner.jar
          retention-days: 1

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Gerar APK
        run: gradle assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: CellCerto-APK
          path: app/build/outputs/apk/debug/app-debug.apk
