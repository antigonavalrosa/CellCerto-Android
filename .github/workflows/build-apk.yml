name: Build CellCerto APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Montar vídeo de abertura
        run: |
          mkdir -p app/src/main/res/raw
          cat video_parts/part*.txt | tr -d '\n\r' | base64 -d > app/src/main/res/raw/intro.mp4
          ls -lh app/src/main/res/raw/intro.mp4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android 34
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Gerar APK
        run: gradle assembleDebug

      - name: Salvar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: CellCerto-APK
          path: app/build/outputs/apk/debug/app-debug.apk
