name: Build CellCerto APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restaurar assinatura oficial
        uses: actions/cache@v4
        with:
          path: /home/runner/.android/debug.keystore
          key: cellcerto-oficial-signing-v1

      - name: Criar assinatura oficial se necessário
        run: |
          mkdir -p /home/runner/.android
          if [ ! -f /home/runner/.android/debug.keystore ]; then
            keytool -genkeypair -v               -keystore /home/runner/.android/debug.keystore               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=CellCerto Oficial, O=CellCerto Box 221, C=BR"
          fi
          keytool -list -keystore /home/runner/.android/debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Instalar Android 34
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Gerar APK
        run: gradle clean assembleDebug

      - name: Verificar APK
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -n 5

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: CellCerto-Oficial-APK
          path: app/build/outputs/apk/debug/app-debug.apk
