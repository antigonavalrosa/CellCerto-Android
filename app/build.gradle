plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.cellcertobox221.app'
    compileSdk 34

    defaultConfig {
        applicationId 'br.com.cellcertobox221.app'
        minSdk 23
        targetSdk 34
        versionCode 10
        versionName '8.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
